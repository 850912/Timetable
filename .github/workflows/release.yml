name: Signed Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TIMETABLE_RELEASE_STORE_PASSWORD: ${{ secrets.TIMETABLE_RELEASE_STORE_PASSWORD }}
      TIMETABLE_RELEASE_KEY_ALIAS: ${{ secrets.TIMETABLE_RELEASE_KEY_ALIAS }}
      TIMETABLE_RELEASE_KEY_PASSWORD: ${{ secrets.TIMETABLE_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate signing secrets
        shell: bash
        env:
          TIMETABLE_RELEASE_JKS_BASE64: ${{ secrets.TIMETABLE_RELEASE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          : "${TIMETABLE_RELEASE_JKS_BASE64:?Missing TIMETABLE_RELEASE_JKS_BASE64 secret}"
          : "${TIMETABLE_RELEASE_STORE_PASSWORD:?Missing TIMETABLE_RELEASE_STORE_PASSWORD secret}"
          : "${TIMETABLE_RELEASE_KEY_ALIAS:?Missing TIMETABLE_RELEASE_KEY_ALIAS secret}"
          : "${TIMETABLE_RELEASE_KEY_PASSWORD:?Missing TIMETABLE_RELEASE_KEY_PASSWORD secret}"

      - name: Restore release keystore
        shell: bash
        env:
          TIMETABLE_RELEASE_JKS_BASE64: ${{ secrets.TIMETABLE_RELEASE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/timetable-release.jks"
          printf '%s' "$TIMETABLE_RELEASE_JKS_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "TIMETABLE_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify keystore and alias
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$TIMETABLE_RELEASE_STORE_FILE" \
            -storepass "$TIMETABLE_RELEASE_STORE_PASSWORD" \
            -alias "$TIMETABLE_RELEASE_KEY_ALIAS" >/dev/null

      - name: Run JVM regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :shared:test :mobile:testDebugUnitTest :wear:testDebugUnitTest

      - name: Build signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :mobile:assembleRelease :wear:assembleRelease

      - name: Upload mobile release APK
        uses: actions/upload-artifact@v5
        with:
          name: timetable-mobile-release
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload wear release APKs
        uses: actions/upload-artifact@v5
        with:
          name: timetable-wear-release
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/timetable-release.jks"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed mobile APK
        uses: actions/download-artifact@v6
        with:
          name: timetable-mobile-release
          path: release-assets/mobile

      - name: Download signed Wear APKs
        uses: actions/download-artifact@v6
        with:
          name: timetable-wear-release
          path: release-assets/wear

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Timetable 3.5.4

          本次更新重点提升手机与 Wear OS 的液态玻璃视觉、滚动流畅度和数据可靠性。

          ### 界面与性能

          - Wear OS 液态玻璃新增柔和、平衡、流体三种效果。
          - 模糊、折射、清透度、底色浓度和边缘色散可调。
          - 手机端加入动态主题环境光、半透明玻璃卡片和课程色彩高光。
          - 优化 Wear OS 首页触摸检测、课程文本缓存和下一节课查找。
          - About 页面更新为 3.5.4，并加入完全自愿的“赛博乞讨”支持入口。

          ### 课程与数据

          - 导入前预览课程、时间段和重复课表。
          - 支持新增导入和替换导入模式。
          - 新增同步中心、失败记录重试和同步恢复。
          - 新增每日自动 JSON 备份。
          - 课程通知支持延后 5 分钟。

          ### 中国设备兼容

          - 保留旧 Wear Data Layer 路径。
          - 保留国行设备 BLE 兼容协议和 CRC32 v2 可选协议。
          - 保留 Xiaomi / 中国 ROM 触觉反馈安全回退。
          - 手机与手表 Release APK 使用同一签名证书。

          ### 下载说明

          - `mobile-release.apk`：手机端。
          - `wear-universal-release.apk`：Wear OS 通用包，通常优先下载此包。
          - `wear-arm64-v8a-release.apk`：64 位 Wear OS 设备。
          - `wear-armeabi-v7a-release.apk`：32 位 Wear OS 设备。
          EOF

          mobile_apk=(release-assets/mobile/*.apk)
          wear_universal=(release-assets/wear/*universal*.apk)
          wear_arm64=(release-assets/wear/*arm64-v8a*.apk)
          wear_arm32=(release-assets/wear/*armeabi-v7a*.apk)

          cp "${mobile_apk[0]}" "$RUNNER_TEMP/mobile-release.apk"
          cp "${wear_universal[0]}" "$RUNNER_TEMP/wear-universal-release.apk"
          cp "${wear_arm64[0]}" "$RUNNER_TEMP/wear-arm64-v8a-release.apk"
          cp "${wear_arm32[0]}" "$RUNNER_TEMP/wear-armeabi-v7a-release.apk"

          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/mobile-release.apk" \
            "$RUNNER_TEMP/wear-universal-release.apk" \
            "$RUNNER_TEMP/wear-arm64-v8a-release.apk" \
            "$RUNNER_TEMP/wear-armeabi-v7a-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Timetable 3.5.4" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

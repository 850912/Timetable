name: Signed Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.version.outputs.artifact-name }}
    env:
      TIMETABLE_RELEASE_STORE_PASSWORD: ${{ secrets.TIMETABLE_RELEASE_STORE_PASSWORD }}
      TIMETABLE_RELEASE_KEY_ALIAS: ${{ secrets.TIMETABLE_RELEASE_KEY_ALIAS }}
      TIMETABLE_RELEASE_KEY_PASSWORD: ${{ secrets.TIMETABLE_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          MOBILE_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile/build.gradle.kts | head -n 1)
          WEAR_VERSION=$(sed -n 's/val versionPrefix = "\([^"]*\)"/\1/p' wear/build.gradle.kts | head -n 1)
          test -n "$MOBILE_VERSION"
          test "$MOBILE_VERSION" = "$WEAR_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$MOBILE_VERSION"
          fi
          echo "artifact-name=timetable-$MOBILE_VERSION-release" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        shell: bash
        env:
          TIMETABLE_RELEASE_JKS_BASE64: ${{ secrets.TIMETABLE_RELEASE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          : "${TIMETABLE_RELEASE_JKS_BASE64:?Missing TIMETABLE_RELEASE_JKS_BASE64 secret}"
          : "${TIMETABLE_RELEASE_STORE_PASSWORD:?Missing TIMETABLE_RELEASE_STORE_PASSWORD secret}"
          : "${TIMETABLE_RELEASE_KEY_ALIAS:?Missing TIMETABLE_RELEASE_KEY_ALIAS secret}"
          : "${TIMETABLE_RELEASE_KEY_PASSWORD:?Missing TIMETABLE_RELEASE_KEY_PASSWORD secret}"

      - name: Restore release keystore
        shell: bash
        env:
          TIMETABLE_RELEASE_JKS_BASE64: ${{ secrets.TIMETABLE_RELEASE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/timetable-release.jks"
          printf '%s' "$TIMETABLE_RELEASE_JKS_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "TIMETABLE_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify keystore and alias
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$TIMETABLE_RELEASE_STORE_FILE" \
            -storepass "$TIMETABLE_RELEASE_STORE_PASSWORD" \
            -alias "$TIMETABLE_RELEASE_KEY_ALIAS" >/dev/null

      - name: Test and build signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :shared:test \
            :mobile:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :mobile:assembleRelease \
            :wear:assembleRelease

      - name: Verify and stage release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -d '' MOBILE_APKS < <(find mobile/build/outputs/apk/release -type f -name '*.apk' -print0)
          mapfile -d '' WEAR_APKS < <(find wear/build/outputs/apk/release -type f -name '*.apk' -print0)
          test "${#MOBILE_APKS[@]}" -gt 0
          test "${#WEAR_APKS[@]}" -gt 0
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          for apk in "${MOBILE_APKS[@]}" "${WEAR_APKS[@]}"; do
            unzip -t "$apk" >/dev/null
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            cp "$apk" "dist/$(basename "$apk")"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/timetable-release.jks"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.release.outputs.artifact-name }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

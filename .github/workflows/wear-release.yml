name: Build Wear OS Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-wear:
    name: Build Wear OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Wear OS Release
        run: ./gradlew :wear:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Wear APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-wear-release
          path: |
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

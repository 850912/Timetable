name: Debug Validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run JVM tests and debug builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :shared:test \
            :mobile:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :mobile:assembleDebug \
            :wear:assembleDebug

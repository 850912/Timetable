name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create build log directory
        run: mkdir -p build-logs

      - name: Verify bundled production keystore
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_KEYSTORE_SHA256="cd6f6307601cee8dc3c77491ae21bddd37e93cac2e111bf7d3ca0d371c26e233"
          ACTUAL_KEYSTORE_SHA256="$(sha256sum signing/timetable-release.jks | awk '{print $1}')"
          if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_KEYSTORE_SHA256" ]; then
            echo "Production keystore SHA-256 mismatch." >&2
            echo "Expected: $EXPECTED_KEYSTORE_SHA256" >&2
            echo "Actual:   $ACTUAL_KEYSTORE_SHA256" >&2
            exit 1
          fi
          echo "Bundled production keystore verified."

      - name: Run shared tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:test --no-daemon --stacktrace --warning-mode all 2>&1 | tee build-logs/shared-test.log

      - name: Build Mobile Release
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :mobile:assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee build-logs/mobile-release.log

      - name: Build Wear Release
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :wear:assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee build-logs/wear-release.log

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          EXPECTED_CERT_SHA256="1b855e6e47f399c7c331c84e7991a6831fd29c9bce9edb1a799232f558fc2060"

          mapfile -t MOBILE_APKS < <(find mobile/build/outputs/apk/release -type f -name '*.apk' | sort)
          mapfile -t WEAR_APKS < <(find wear/build/outputs/apk/release -type f -name '*.apk' | sort)

          if [ "${#MOBILE_APKS[@]}" -eq 0 ] || [ "${#WEAR_APKS[@]}" -eq 0 ]; then
            echo "One or more release APK sets were not found." >&2
            exit 1
          fi

          for apk in "${MOBILE_APKS[@]}" "${WEAR_APKS[@]}"; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

          cert_digest() {
            "$APKSIGNER" verify --print-certs "$1" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -n 1
          }

          MOBILE_CERT="$(cert_digest "${MOBILE_APKS[0]}")"
          MOBILE_CERT_NORMALIZED="$(printf '%s' "$MOBILE_CERT" | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          if [ -z "$MOBILE_CERT" ]; then
            echo "Unable to read mobile APK signing certificate digest." >&2
            exit 1
          fi

          if [ "$MOBILE_CERT_NORMALIZED" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Mobile APK is NOT signed with the original production certificate." >&2
            echo "Expected: $EXPECTED_CERT_SHA256" >&2
            echo "Actual:   $MOBILE_CERT_NORMALIZED" >&2
            exit 1
          fi

          for apk in "${WEAR_APKS[@]}"; do
            OTHER_CERT="$(cert_digest "$apk")"

            if [ -z "$OTHER_CERT" ]; then
              echo "Unable to read signing certificate digest for $apk" >&2
              exit 1
            fi

            OTHER_CERT_NORMALIZED="$(printf '%s' "$OTHER_CERT" | tr '[:upper:]' '[:lower:]' | tr -d ':')"

            if [ "$OTHER_CERT_NORMALIZED" != "$EXPECTED_CERT_SHA256" ]; then
              echo "APK is NOT signed with the original production certificate: $apk" >&2
              echo "Expected: $EXPECTED_CERT_SHA256" >&2
              echo "Actual:   $OTHER_CERT_NORMALIZED" >&2
              exit 1
            fi

            if [ "$MOBILE_CERT_NORMALIZED" != "$OTHER_CERT_NORMALIZED" ]; then
              echo "APK signing certificates do not match." >&2
              echo "Reference mobile: $MOBILE_CERT_NORMALIZED" >&2
              echo "Other ($apk): $OTHER_CERT_NORMALIZED" >&2
              exit 1
            fi
          done

          echo "All release APK signatures match: $MOBILE_CERT"


      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: build-logs/*.log
          if-no-files-found: ignore

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release
          path: mobile/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Wear APKs
        uses: actions/upload-artifact@v4
        with:
          name: wear-release
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
